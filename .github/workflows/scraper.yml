name: Ejecutar Scraper

on:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: browser-actions/setup-chrome@v1

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar scraper
        run: |
          python main.py
