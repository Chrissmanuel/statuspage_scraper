name: Ejecutar Scraper

on:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Setup ChromeDriver
        run: |
          # Instalar chromedriver desde chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-chromedriver
          
          # Crear symlink para que selenium lo encuentre
          sudo ln -sf /usr/lib/chromium-browser/chromedriver /usr/local/bin/chromedriver
          
          # Verificar instalación
          chromedriver --version

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar scraper
        run: |
          python main.py