name: Ejecutar Scraper

on:
  # 🔌 Esto permite que servicios externos despierten este repositorio al instante
  repository_dispatch:
    types: [disparar_scraper]
  workflow_dispatch: # Conservarlo para poder pulsar el botón manual si quieres

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Verificar secretos (debug)
        run: |
          if [ -n "$WEB_APP_URL" ]; then
            echo "✅ WEB_APP_URL está configurado"
          else
            echo "❌ WEB_APP_URL NO está configurado"
          fi
        env:
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip' # ⚡ Descarga las librerías más rápido usando la caché de GitHub

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar scraper
        env:
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        run: |
          python main.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 💡 Asegura que los archivos existan (si no existen, los crea vacíos) 
          # para que 'git add' no lance un error si el scraper no generó datos.
          touch pendientes_incidentes.json resultado_incidentes.json
          
          git add pendientes_incidentes.json resultado_incidentes.json
          
          # Compara si hay cambios reales. Si los hay, hace commit y push de forma segura.
          git diff --staged --quiet || (git commit -m "📊 Actualizar estado automático" && git push)